<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上魔方賽事防作弊錄影系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .main-card {
      background: #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 900px;
      width: 100%;
    }
    h1 { font-size: 1.5rem; margin-bottom: 20px; color: #e0e0e0; }
    video { display: none; }
    .canvas-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .camera-select-group {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    select {
      padding: 8px 12px;
      border-radius: 6px;
      background: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 16px;
    }
    button {
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-start { background-color: #2e7d32; color: #ffffff; }
    .btn-stop { background-color: #c62828; color: #ffffff; }
    button:disabled, select:disabled {
      background-color: #424242;
      color: #757575;
      cursor: not-allowed;
    }
    .status-text { margin-top: 12px; font-size: 0.9rem; color: #aaa; }
  </style>
</head>
<body>

<div class="main-card">
  <h1>線上魔方賽事防作弊錄影系統</h1>

  <video id="webcam" autoplay playsinline muted></video>

  <div class="canvas-container">
    <canvas id="recorderCanvas" width="960" height="720"></canvas>
  </div>

  <div class="camera-select-group">
    <label for="cameraSelect">選擇鏡頭：</label>
    <select id="cameraSelect"><option value="">讀取鏡頭列表中...</option></select>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn-start">開始比賽並錄影</button>
    <button id="stopBtn" class="btn-stop" disabled>結束並下載影片</button>
  </div>

  <p id="status" class="status-text">請允許攝影機與麥克風存取權限...</p>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('recorderCanvas');
  const ctx = canvas.getContext('2d');
  const cameraSelect = document.getElementById('cameraSelect');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusText = document.getElementById('status');

  let mediaRecorder;
  let recordedChunks = [];
  let scrambleText = "點擊「開始比賽」後顯示打亂公式";
  let currentStream = null;

  // 1. 取得裝置相機清單
  async function getCameraDevices() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(device => device.kind === 'videoinput');
      
      cameraSelect.innerHTML = '';
      videoDevices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `攝影機 ${index + 1}`;
        cameraSelect.appendChild(option);
      });
    } catch (e) {
      console.error("無法列出鏡頭：", e);
    }
  }

  // 2. 啟動鏡頭（原生 MediaDevices API）
  async function startCamera(deviceId) {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
    }

    const constraints = {
      video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "user" },
      audio: true
    };

    try {
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;
      await video.play();
      
      await getCameraDevices();
      if (deviceId) cameraSelect.value = deviceId;
      
      statusText.textContent = "鏡頭就緒，請點擊「開始比賽」";
      renderFrame();
    } catch (err) {
      statusText.textContent = "鏡頭讀取失敗，請確保使用 HTTPS 或在本地 (localhost) 測試並允許權限。";
      console.error("鏡頭開啟錯誤：", err);
    }
  }

  // 3. WCA 打亂公式生成
  function generateWcaScramble() {
    const faces = ["U", "D", "L", "R", "F", "B"];
    const modifiers = ["", "'", "2"];
    let scramble = [];
    let lastFace = "";

    while (scramble.length < 20) {
      let face = faces[Math.floor(Math.random() * faces.length)];
      if (face !== lastFace) {
        let modifier = modifiers[Math.floor(Math.random() * modifiers.length)];
        scramble.push(face + modifier);
        lastFace = face;
      }
    }
    return scramble.join(" ");
  }

  // 4. 繪製畫面
  function renderFrame() {
    const cameraHeight = canvas.height * 0.8;
    const scrambleHeight = canvas.height * 0.2;

    ctx.drawImage(video, 0, 0, canvas.width, cameraHeight);

    ctx.fillStyle = "#e0e0e0";
    ctx.fillRect(0, cameraHeight, canvas.width, scrambleHeight);

    ctx.fillStyle = "#000000";
    ctx.font = "bold 28px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(scrambleText, canvas.width / 2, cameraHeight + (scrambleHeight / 2));

    requestAnimationFrame(renderFrame);
  }

  cameraSelect.addEventListener('change', () => {
    startCamera(cameraSelect.value);
  });

  // 5. 開始錄影
  startBtn.addEventListener('click', () => {
    scrambleText = generateWcaScramble();

    const canvasStream = canvas.captureStream(25);
    if (currentStream && currentStream.getAudioTracks().length > 0) {
      canvasStream.addTrack(currentStream.getAudioTracks()[0].clone());
    }

    recordedChunks = [];

    // 優先選取支援 MP4 的 MediaOptions，讓 Google Drive 能夠順利預覽
    let options = { mimeType: 'video/mp4' };
    if (!MediaRecorder.isTypeSupported('video/mp4')) {
      if (MediaRecorder.isTypeSupported('video/webm;codecs=h264')) {
        options = { mimeType: 'video/webm;codecs=h264' };
      } else {
        options = { mimeType: 'video/webm' };
      }
    }

    try {
      mediaRecorder = new MediaRecorder(canvasStream, options);
    } catch (e) {
      mediaRecorder = new MediaRecorder(canvasStream);
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = saveVideo;
    mediaRecorder.start(1000);

    startBtn.disabled = true;
    cameraSelect.disabled = true;
    stopBtn.disabled = false;
    statusText.textContent = "比賽錄影中...";
  });

  // 6. 停止錄影
  stopBtn.addEventListener('click', () => {
    statusText.textContent = "正在匯出影片...";
    stopBtn.disabled = true;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
  });

  // 7. 儲存檔案（強制打包為線上預覽相容格式）
  function saveVideo() {
    try {
      const blob = new Blob(recordedChunks, { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = `cubing_match_${Date.now()}.mp4`;
      
      document.body.appendChild(a);
      a.click();
      
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        startBtn.disabled = false;
        cameraSelect.disabled = false;
        statusText.textContent = "影片已下載，可以直接上傳至 Google Drive！";
      }, 500);
    } catch (err) {
      console.error(err);
      statusText.textContent = "匯出失敗，請重試。";
    }
  }

  window.onload = () => startCamera();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多輪次活動管理系統</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #1a252f;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      padding: 20px;
      border-top: 5px solid #ccc;
    }

    .card-registration {
      border-top-color: #3498db;
    }

    .card-active {
      border-top-color: #2ecc71;
    }

    .card-history {
      border-top-color: #9b59b6;
    }

    h2 {
      font-size: 1.25rem;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
      color: #fff;
      background-color: #7f8c8d;
    }

    .badge-reg { background-color: #3498db; }
    .badge-act { background-color: #2ecc71; }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: #3498db;
      color: white;
    }
    .btn-primary:hover { background-color: #2980b9; }

    .btn-success {
      background-color: #2ecc71;
      color: white;
    }
    .btn-success:hover { background-color: #27ae60; }

    .btn-danger {
      background-color: #e74c3c;
      color: white;
    }
    .btn-danger:hover { background-color: #c0392b; }

    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    .list-container {
      margin-top: 15px;
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 4px;
      padding: 10px;
      background-color: #fafafa;
    }

    .participant-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid #eee;
      background-color: #fff;
      margin-bottom: 5px;
      border-radius: 3px;
    }

    .time-info {
      background-color: #f8f9fa;
      border-left: 4px solid #3498db;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      color: #555;
    }

    .time-info p {
      margin-bottom: 3px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f2f2f2;
      color: #333;
    }

    tr:hover {
      background-color: #f9f9f9;
    }

    .empty-msg {
      text-align: center;
      color: #999;
      font-style: italic;
      padding: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>多輪次活動管理系統</h1>

  <div class="main-grid">
    <!-- 區域 1：報名階段視窗 -->
    <div class="card card-registration">
      <h2>
        <span>區域 A：報名階段</span>
        <span id="regRoundBadge" class="badge badge-reg">第 1 輪報名中</span>
      </h2>

      <div class="time-info">
        <p><strong>本輪報名開始時間：</strong> <span id="regStartTime">尚未開始</span></p>
        <p><strong>本輪報名預計結束：</strong> 轉入進行階段時自動記錄</p>
      </div>

      <div class="form-group">
        <label for="participantName">新增報名者姓名</label>
        <input type="text" id="participantName" placeholder="請輸入姓名" disabled>
      </div>

      <div class="button-group">
        <button id="btnStartRegistration" class="btn-primary" onclick="startRegistration()">開啟本輪報名</button>
        <button id="btnAddParticipant" class="btn-primary" onclick="addParticipant()" disabled>新增報名</button>
      </div>

      <div class="button-group">
        <button id="btnTransferToActive" class="btn-success" onclick="transferToActive()" disabled>結束報名並移至進行區</button>
      </div>

      <div class="list-container">
        <div id="registrationList">
          <div class="empty-msg">目前沒有報名者</div>
        </div>
      </div>
    </div>

    <!-- 區域 2：進行階段視窗 -->
    <div class="card card-active">
      <h2>
        <span>區域 B：進行階段</span>
        <span id="activeRoundBadge" class="badge badge-act">等待移入</span>
      </h2>

      <div class="time-info" style="border-left-color: #2ecc71;">
        <p><strong>本輪進行開始時間：</strong> <span id="actStartTime">尚未開始</span></p>
        <p><strong>本輪進行結束時間：</strong> <span id="actEndTime">進行中</span></p>
      </div>

      <div class="button-group">
        <button id="btnFinishRound" class="btn-danger" onclick="finishRound()" disabled>完成並結算本輪</button>
      </div>

      <div class="list-container">
        <div id="activeList">
          <div class="empty-msg">進行區目前無人員</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 區域 3：歷史輪次紀錄視窗 -->
  <div class="card card-history">
    <h2>歷史輪次紀錄（含完整時間戳記）</h2>
    <table>
      <thead>
        <tr>
          <th>輪次</th>
          <th>報名開始時間</th>
          <th>報名結束時間</th>
          <th>進行開始時間</th>
          <th>進行結束時間</th>
          <th>參與人數</th>
          <th>名單內容</th>
        </tr>
      </thead>
      <tbody id="historyTableBody">
        <tr>
          <td colspan="7" class="empty-msg">尚無已完成的輪次紀錄</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // 系統狀態管理物件
  let currentRound = 1;
  let isRegistrationOpen = false;
  let isActiveOpen = false;

  // 當前輪次的資料結構
  let roundData = {
    roundNumber: 1,
    registrationStartTime: null,
    registrationEndTime: null,
    activeStartTime: null,
    activeEndTime: null,
    participants: []
  };

  // 歷史紀錄儲存陣列
  const historyLogs = [];

  // 格式化時間函數 (YYYY-MM-DD HH:mm:ss)
  function formatTimestamp(date) {
    if (!date) return "未記錄";
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
  }

  // 1. 開啟本輪報名
  function startRegistration() {
    isRegistrationOpen = true;
    roundData.roundNumber = currentRound;
    roundData.registrationStartTime = new Date();
    roundData.registrationEndTime = null;
    roundData.activeStartTime = null;
    roundData.activeEndTime = null;
    roundData.participants = [];

    // 更新畫面 UI
    document.getElementById('regStartTime').innerText = formatTimestamp(roundData.registrationStartTime);
    document.getElementById('regRoundBadge').innerText = `第 ${currentRound} 輪報名中`;
    document.getElementById('participantName').disabled = false;
    document.getElementById('btnAddParticipant').disabled = false;
    document.getElementById('btnTransferToActive').disabled = false;
    document.getElementById('btnStartRegistration').disabled = true;

    renderRegistrationList();
  }

  // 2. 新增名單至報名區
  function addParticipant() {
    const inputField = document.getElementById('participantName');
    const name = inputField.value.trim();

    if (name === "") {
      alert("請輸入報名者姓名！");
      return;
    }

    roundData.participants.push({
      id: Date.now(),
      name: name,
      registeredAt: new Date()
    });

    inputField.value = "";
    renderRegistrationList();
  }

  // 移除報名者
  function removeParticipant(id) {
    if (!isRegistrationOpen) return;
    roundData.participants = roundData.participants.filter(p => p.id !== id);
    renderRegistrationList();
  }

  // 渲染報名清單 UI
  function renderRegistrationList() {
    const container = document.getElementById('registrationList');
    if (roundData.participants.length === 0) {
      container.innerHTML = `<div class="empty-msg">目前沒有報名者</div>`;
      return;
    }

    let html = "";
    roundData.participants.forEach((p, index) => {
      html += `
        <div class="participant-item">
          <span>${index + 1}. ${p.name} <small style="color:#888;">(${formatTimestamp(p.registeredAt)})</small></span>
          ${isRegistrationOpen ? `<button style="flex:none; padding:2px 8px;" class="btn-danger" onclick="removeParticipant(${p.id})">刪除</button>` : ''}
        </div>
      `;
    });
    container.innerHTML = html;
  }

  // 3. 結束報名並轉入進行區
  function transferToActive() {
    if (roundData.participants.length === 0) {
      alert("報名名單為空，無法開始進行階段！");
      return;
    }

    const now = new Date();
    roundData.registrationEndTime = now;
    roundData.activeStartTime = now;

    isRegistrationOpen = false;
    isActiveOpen = true;

    // 控制報名區 UI
    document.getElementById('participantName').disabled = true;
    document.getElementById('btnAddParticipant').disabled = true;
    document.getElementById('btnTransferToActive').disabled = true;
    document.getElementById('regRoundBadge').innerText = `第 ${currentRound} 輪報名已截止`;

    // 控制進行區 UI
    document.getElementById('actStartTime').innerText = formatTimestamp(roundData.activeStartTime);
    document.getElementById('actEndTime').innerText = "進行中...";
    document.getElementById('activeRoundBadge').innerText = `第 ${currentRound} 輪進行中`;
    document.getElementById('btnFinishRound').disabled = false;

    renderActiveList();
    renderRegistrationList(); // 刷掉刪除按鈕
  }

  // 渲染進行區清單 UI
  function renderActiveList() {
    const container = document.getElementById('activeList');
    if (roundData.participants.length === 0) {
      container.innerHTML = `<div class="empty-msg">進行區目前無人員</div>`;
      return;
    }

    let html = "";
    roundData.participants.forEach((p, index) => {
      html += `
        <div class="participant-item">
          <span>${index + 1}. ${p.name}</span>
          <span style="color:#2ecc71; font-weight:bold; font-size:0.85rem;">進行中</span>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  // 4. 完成並結算本輪
  function finishRound() {
    const now = new Date();
    roundData.activeEndTime = now;
    isActiveOpen = false;

    // 將本輪資料深拷貝存入歷史紀錄
    historyLogs.push({
      roundNumber: roundData.roundNumber,
      registrationStartTime: roundData.registrationStartTime,
      registrationEndTime: roundData.registrationEndTime,
      activeStartTime: roundData.activeStartTime,
      activeEndTime: roundData.activeEndTime,
      participants: [...roundData.participants]
    });

    // 關閉進行區狀態
    document.getElementById('actEndTime').innerText = formatTimestamp(roundData.activeEndTime);
    document.getElementById('activeRoundBadge').innerText = `第 ${currentRound} 輪已完成`;
    document.getElementById('btnFinishRound').disabled = true;

    // 更新歷史紀錄顯示
    renderHistoryTable();

    // 準備推進到下一輪
    currentRound++;
    document.getElementById('btnStartRegistration').disabled = false;
    document.getElementById('btnStartRegistration').innerText = `開啟第 ${currentRound} 輪報名`;
  }

  // 5. 渲染歷史紀錄表格 UI
  function renderHistoryTable() {
    const tbody = document.getElementById('historyTableBody');
    if (historyLogs.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty-msg">尚無已完成的輪次紀錄</td></tr>`;
      return;
    }

    let html = "";
    historyLogs.forEach(log => {
      const namesList = log.participants.map(p => p.name).join(", ");
      html += `
        <tr>
          <td><strong>第 ${log.roundNumber} 輪</strong></td>
          <td>${formatTimestamp(log.registrationStartTime)}</td>
          <td>${formatTimestamp(log.registrationEndTime)}</td>
          <td>${formatTimestamp(log.activeStartTime)}</td>
          <td>${formatTimestamp(log.activeEndTime)}</td>
          <td>${log.participants.length} 人</td>
          <td>${namesList}</td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }
</script>

</body>
</html>

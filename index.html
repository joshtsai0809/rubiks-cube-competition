<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上魔方賽事防作弊錄影系統</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .main-card {
      background: #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 900px;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #e0e0e0;
    }
    /* 隱藏原始視訊標籤，僅顯示繪製後的 Canvas */
    video {
      display: none;
    }
    .canvas-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      margin-top: 24px;
      display: flex;
      gap: 16px;
      width: 100%;
      justify-content: center;
    }
    button {
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-start {
      background-color: #2e7d32;
      color: #ffffff;
    }
    .btn-start:hover {
      background-color: #388e3c;
    }
    .btn-stop {
      background-color: #c62828;
      color: #ffffff;
    }
    .btn-stop:hover {
      background-color: #d32f2f;
    }
    button:disabled {
      background-color: #424242;
      color: #757575;
      cursor: not-allowed;
    }
    .status-text {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>

<div class="main-card">
  <h1>線上魔方賽事防作弊錄影系統</h1>

  <!-- 底層攝影機串流 -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- 合成後的畫面（相機 + 打亂公式） -->
  <div class="canvas-container">
    <canvas id="recorderCanvas" width="1280" height="960"></canvas>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn-start">開始比賽並錄影</button>
    <button id="stopBtn" class="btn-stop" disabled>結束並下載影片</button>
  </div>

  <p id="status" class="status-text">請允許攝影機權限以載入畫面...</p>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('recorderCanvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusText = document.getElementById('status');

  let mediaRecorder;
  let recordedChunks = [];
  let scrambleText = "點擊「開始比賽」後顯示打亂公式";
  let isRecording = false;

  // 1. 初始化相機
  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: true
      });
      video.srcObject = stream;
      await video.play();
      statusText.textContent = "系統就緒，準備開始比賽。";
      requestAnimationFrame(renderFrame);
    } catch (err) {
      statusText.textContent = "無法存取攝影機與麥克風，請檢查存取權限。";
      console.error(err);
    }
  }

  // 2. 生成標準三階魔方打亂公式（20步）
  function generateWcaScramble() {
    const faces = ["U", "D", "L", "R", "F", "B"];
    const modifiers = ["", "'", "2"];
    let scramble = [];
    let lastFace = "";

    while (scramble.length < 20) {
      let face = faces[Math.floor(Math.random() * faces.length)];
      if (face !== lastFace) {
        let modifier = modifiers[Math.floor(Math.random() * modifiers.length)];
        scramble.push(face + modifier);
        lastFace = face;
      }
    }
    return scramble.join(" ");
  }

  // 3. 即時將「相機畫面」與「打亂公式」繪製到 Canvas
  function renderFrame() {
    const cameraHeight = canvas.height * 0.8; // 80% 留給相機畫面
    const scrambleHeight = canvas.height * 0.2; // 20% 留給打亂公式

    // 繪製相機畫面（上方灰色區塊位置）
    ctx.drawImage(video, 0, 0, canvas.width, cameraHeight);

    // 繪製下方公式區域背景（淡灰色背景）
    ctx.fillStyle = "#e0e0e0";
    ctx.fillRect(0, cameraHeight, canvas.width, scrambleHeight);

    // 繪製打亂公式文字（黑色字體）
    ctx.fillStyle = "#000000";
    ctx.font = "bold 36px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(scrambleText, canvas.width / 2, cameraHeight + (scrambleHeight / 2));

    requestAnimationFrame(renderFrame);
  }

  // 4. 開始錄影與比賽
  startBtn.addEventListener('click', () => {
    // 進入全螢幕防干擾
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }

    // 生成當前回合的動態公式
    scrambleText = generateWcaScramble();

    // 擷取 Canvas 畫面數據串流 (30 FPS)
    const canvasStream = canvas.captureStream(30);

    // 結合聲音軌道
    if (video.srcObject && video.srcObject.getAudioTracks().length > 0) {
      canvasStream.addTrack(video.srcObject.getAudioTracks()[0]);
    }

    recordedChunks = [];
    mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) {
        recordedChunks.push(e.data);
      }
    };

    mediaRecorder.onstop = saveVideo;

    mediaRecorder.start();
    isRecording = true;

    startBtn.disabled = true;
    stopBtn.disabled = false;
    statusText.textContent = "比賽進行中，畫面與聲音全程錄影中...";
  });

  // 5. 結束比賽並儲存
  stopBtn.addEventListener('click', () => {
    mediaRecorder.stop();
    isRecording = false;

    if (document.exitFullscreen && document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }

    startBtn.disabled = false;
    stopBtn.disabled = true;
    statusText.textContent = "錄影已完成，正在生成影片下載...";
  });

  // 下載影片檔
  function saveVideo() {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cubing_match_${Date.now()}.webm`;
    a.click();
    URL.revokeObjectURL(url);
  }

  window.onload = initCamera;
</script>

</body>
</html>
